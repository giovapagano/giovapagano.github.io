# Research projects shown on /research/. Publications are attached automatically
# through the `project = {slug}` field in _data/cv/publications.bib.
- slug: visual-politics
  title: Visual Politics
  image: /images/research/visual_consistency_pipeline.png
  summary: >-
    We study how political actors use images on platforms like Instagram to shape narratives,
    focusing on populist radical right parties, and visual consistency in campaign communication.

- slug: eu-laws
  title: "EU Legislative Texts: Constraints and Delegation"
  image: /images/research/eu_laws.png
  summary: >-
    This research investigates how legislative texts can be systematically mined to shed light on
    legislative-executive relations, focusing on patterns of delegation and constraint that structure
    the chain of authority from voters to bureaucrats. By analyzing legislative texts, we provide new
    insights into how legislators confer powers on executive actors and impose limits on their
    actions—revealing the formal architecture of political authority embedded in EU legislation.

- slug: democratic-rhetoric
  title: Democratic Rhetoric in Autocratizing Regimes
  image: /images/research/demo_rhetoric_freedom.png
  summary: >-
    We examine how the semantics of liberal-democratic concepts shift in speeches from regimes
    undergoing autocratization, using embedding regression to track rhetorical change over time
    and across contexts.
