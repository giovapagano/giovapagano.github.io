# Site settings. Personal details (name, links, photo) live in _data/cv/profile.yml.
title: Giovanni Pagano
description: >-
  Research Fellow in political science at the University of Milan, working on
  multimodal political communication and computational methods.
url: https://giovapagano.github.io
baseurl: ""
lang: en
locale: en_US

author:
  name: Giovanni Pagano
social:
  name: Giovanni Pagano
  links:
    - https://scholar.google.com/citations?user=af8iXX8AAAAJ
    - https://orcid.org/0000-0002-7825-3003
    - https://github.com/giovapagano
    - https://bsky.app/profile/giovannipagano.bsky.social

# Built by .github/workflows/deploy.yml from cv/main.tex
cv_pdf: /files/Giovanni_Pagano_CV.pdf

nav:
  - title: About
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Teaching
    url: /teaching/
  - title: CV
    url: /cv/

defaults:
  - scope: { path: "" }
    values: { layout: base }

plugins:
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - cv/
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
